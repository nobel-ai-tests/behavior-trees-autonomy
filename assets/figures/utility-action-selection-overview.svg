<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Utility-Based Action Selection overview</title><desc id="desc">Robot context is scored across several candidate actions and the highest feasible utility is selected.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#10254b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#50627d}.h{font-size:22px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#53657c}.arrow{stroke:#1b2738;stroke-width:2.4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2738"/></marker></defs><rect width="1200" height="675" fill="#f8fbff"/><rect x="28" y="28" width="1144" height="619" fill="#fff" stroke="#c7d8eb" stroke-width="2"/><text x="600" y="76" text-anchor="middle" class="title">Utility-Based Action Selection</text><text x="600" y="108" text-anchor="middle" class="sub">Additional fast-decision resource — Behavior Trees remain the core architecture</text><rect x="60" y="145" width="260" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="82" y="184" class="h">Core idea</text><text x="82" y="222" class="t">Score each feasible action</text><text x="82" y="248" class="t">from current context.</text><rect x="82" y="292" width="215" height="92" fill="#fff" stroke="#98b8db"/><text x="189" y="325" text-anchor="middle" class="t">utility = benefit</text><text x="189" y="350" text-anchor="middle" class="h">− cost − risk</text><text x="189" y="374" text-anchor="middle" class="small">choose maximum</text><text x="82" y="432" class="small">Useful when priorities vary</text><text x="82" y="454" class="small">continuously with battery,</text><text x="82" y="476" class="small">distance, risk, urgency,</text><text x="82" y="498" class="small">or confidence.</text><rect x="348" y="145" width="548" height="420" fill="#fff" stroke="#b7cee8"/><text x="374" y="184" class="h">Observe → score → select</text><text x="388" y="219" class="small">context inputs</text><rect x="378" y="238" width="92" height="62" fill="#e0f5e6" stroke="#55a66a"/><text x="424" y="264" text-anchor="middle" class="t">Battery</text><text x="424" y="286" text-anchor="middle" class="small">20%</text><rect x="482" y="238" width="92" height="62" fill="#dceeff" stroke="#397bc0"/><text x="528" y="264" text-anchor="middle" class="t">Distance</text><text x="528" y="286" text-anchor="middle" class="small">12 m</text><rect x="586" y="238" width="92" height="62" fill="#ffe1e5" stroke="#d75b68"/><text x="632" y="264" text-anchor="middle" class="t">Risk</text><text x="632" y="286" text-anchor="middle" class="small">0.1</text><rect x="690" y="238" width="92" height="62" fill="#fff0cf" stroke="#df9a28"/><text x="736" y="264" text-anchor="middle" class="t">Priority</text><text x="736" y="286" text-anchor="middle" class="small">high</text><rect x="794" y="238" width="72" height="62" fill="#eee5ff" stroke="#8462c8"/><text x="830" y="264" text-anchor="middle" class="t">Conf.</text><text x="830" y="286" text-anchor="middle" class="small">0.8</text><path d="M424 300V334H622" class="arrow"/><path d="M528 300V322H622" class="arrow"/><path d="M632 300V322" class="arrow"/><path d="M736 300V322H642" class="arrow"/><path d="M830 300V334H642" class="arrow"/><rect x="538" y="338" width="190" height="58" fill="#e9f2ff" stroke="#3567a8" stroke-width="2"/><text x="633" y="373" text-anchor="middle" class="h">UTILITY SCORING</text><path d="M633 396V430" class="arrow"/><rect x="378" y="438" width="105" height="74" fill="#dceeff" stroke="#397bc0"/><text x="430" y="466" text-anchor="middle" class="t">EXPLORE</text><text x="430" y="494" text-anchor="middle" class="h">0.35</text><rect x="500" y="438" width="105" height="74" fill="#d8f2df" stroke="#2f9b4e" stroke-width="3"/><text x="552" y="466" text-anchor="middle" class="t">RECHARGE</text><text x="552" y="494" text-anchor="middle" class="h">0.82</text><rect x="622" y="438" width="115" height="74" fill="#fff0cf" stroke="#df9a28"/><text x="680" y="466" text-anchor="middle" class="t">FOLLOW</text><text x="680" y="494" text-anchor="middle" class="h">0.61</text><rect x="754" y="438" width="105" height="74" fill="#eee5ff" stroke="#8462c8"/><text x="806" y="466" text-anchor="middle" class="t">WAIT</text><text x="806" y="494" text-anchor="middle" class="h">0.20</text><text x="552" y="537" text-anchor="middle" class="small" fill="#2f7c43">selected action</text><rect x="924" y="145" width="216" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="946" y="184" class="h">Why it is fast</text><text x="946" y="228" class="t">• Few comparisons</text><text x="946" y="263" class="t">• No graph search</text><text x="946" y="298" class="t">• Smooth priorities</text><text x="946" y="333" class="t">• Easy to recompute</text><line x1="946" y1="367" x2="1116" y2="367" stroke="#c2d3e5"/><text x="946" y="406" class="h">Trade-off</text><text x="946" y="442" class="t">Score design,</text><text x="946" y="468" class="t">normalization, and</text><text x="946" y="494" class="t">oscillation matter.</text><text x="60" y="611" class="small">BT relationship: utility scoring can rank candidate leaves or subtrees while the Behavior Tree retains task structure and recovery semantics.</text></svg>