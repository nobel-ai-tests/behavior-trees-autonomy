<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Practical behavior-tree engineering workflow for robotics</title>
  <desc id="desc">Semi-complex workflow showing offline task modeling, BT construction, software integration, runtime execution, monitoring, recovery, and data interfaces for a robotics system.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#245b88"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#17202a}.sans{font-family:Arial,Helvetica,sans-serif;fill:#27313b}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#5f6b78}.h2{font-size:20px;font-weight:700}.label{font-size:14px;font-weight:700}.small{font-size:12px}.body{font-size:13px}.muted{fill:#66727f}.panel{fill:#fbfcfd;stroke:#cbd2da}.box{stroke-width:1.4}.arrow{stroke:#64748b;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.feedback{stroke:#245b88;stroke-width:2.2;fill:none;stroke-dasharray:7 5;marker-end:url(#blueArrow)}.mono{font-family:'Courier New',monospace;font-size:12px;fill:#26323d}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="36" y="46" class="serif title">Behavior-tree engineering workflow in a robotics stack</text>
  <text x="36" y="75" class="sans subtitle">Design-time structure and runtime feedback are coupled through shared state, robot skills, monitoring, and recovery.</text>

  <!-- design-time lane -->
  <g transform="translate(36 110)">
    <rect width="1328" height="230" class="panel"/>
    <text x="18" y="30" class="serif h2">A. Design-time modeling and construction</text>
    <text x="1128" y="30" class="sans small muted">offline / engineering loop</text>

    <g transform="translate(20 58)">
      <rect width="205" height="142" fill="#eef4fa" stroke="#245b88" class="box"/>
      <text x="14" y="24" class="sans label">1. Mission specification</text>
      <text x="14" y="48" class="sans small">goal: reach inspection pose</text>
      <text x="14" y="68" class="sans small">constraints: battery &gt; 15%</text>
      <text x="14" y="88" class="sans small">safety: stop / avoid collision</text>
      <text x="14" y="108" class="sans small">success: pose tolerance ≤ 0.2 m</text>
      <text x="14" y="128" class="sans small">failures: blocked path, localization</text>
    </g>
    <path d="M228 129 H274" class="arrow"/>

    <g transform="translate(276 58)">
      <rect width="215" height="142" fill="#f4f7fa" stroke="#718096" class="box"/>
      <text x="14" y="24" class="sans label">2. Action/condition model</text>
      <text x="14" y="48" class="mono">Navigate(goal)</text>
      <text x="14" y="67" class="mono">pre: goal_valid ∧ localized</text>
      <text x="14" y="86" class="mono">post: at_goal</text>
      <text x="14" y="108" class="mono">AvoidObstacle()</text>
      <text x="14" y="127" class="mono">pre: obstacle_near</text>
    </g>
    <path d="M494 129 H540" class="arrow"/>

    <g transform="translate(542 58)">
      <rect width="220" height="142" fill="#eef8f3" stroke="#28775f" class="box"/>
      <text x="14" y="24" class="sans label">3. BT composition</text>
      <text x="14" y="49" class="sans small">priority: safety → recovery → mission</text>
      <text x="14" y="70" class="sans small">Sequence for ordered prerequisites</text>
      <text x="14" y="91" class="sans small">Fallback for alternatives/recovery</text>
      <text x="14" y="112" class="sans small">subtrees define reusable contracts</text>
      <text x="14" y="132" class="sans small">halt policy defined for actions</text>
    </g>
    <path d="M765 129 H811" class="arrow"/>

    <g transform="translate(813 58)">
      <rect width="228" height="142" fill="#f3f0fb" stroke="#6847a5" class="box"/>
      <text x="14" y="24" class="sans label">4. Static checks / simulation</text>
      <text x="14" y="49" class="sans small">reachable success paths</text>
      <text x="14" y="70" class="sans small">recovery coverage</text>
      <text x="14" y="91" class="sans small">timeout / retry bounds</text>
      <text x="14" y="112" class="sans small">skill mock + scenario replay</text>
      <text x="14" y="132" class="sans small">logging schema and trace IDs</text>
    </g>
    <path d="M1044 129 H1090" class="arrow"/>

    <g transform="translate(1092 58)">
      <rect width="216" height="142" fill="#fff7e8" stroke="#a95a13" class="box"/>
      <text x="14" y="24" class="sans label">5. Deployable tree</text>
      <text x="14" y="49" class="mono">tree.xml / tree.json</text>
      <text x="14" y="70" class="sans small">registered skills</text>
      <text x="14" y="91" class="sans small">data-port mappings</text>
      <text x="14" y="112" class="sans small">default blackboard values</text>
      <text x="14" y="132" class="sans small">versioned configuration</text>
    </g>
  </g>

  <!-- integration lane -->
  <g transform="translate(36 366)">
    <rect width="1328" height="154" class="panel"/>
    <text x="18" y="30" class="serif h2">B. Software integration boundary</text>

    <g transform="translate(20 54)">
      <rect width="180" height="72" fill="#f8fafc" stroke="#64748b" class="box"/><text x="90" y="26" text-anchor="middle" class="sans label">BT runtime</text><text x="90" y="49" text-anchor="middle" class="sans small muted">tick scheduler · halt</text>
    </g>
    <path d="M204 90 H252" class="arrow"/>
    <g transform="translate(254 54)">
      <rect width="220" height="72" fill="#f4f7fa" stroke="#718096" class="box"/><text x="110" y="26" text-anchor="middle" class="sans label">Blackboard / typed ports</text><text x="110" y="49" text-anchor="middle" class="mono">goal, pose, obstacle, status</text>
    </g>
    <path d="M478 90 H526" class="arrow"/>
    <g transform="translate(528 54)">
      <rect width="218" height="72" fill="#eef4fa" stroke="#245b88" class="box"/><text x="109" y="26" text-anchor="middle" class="sans label">ROS 2 / middleware</text><text x="109" y="49" text-anchor="middle" class="sans small muted">actions · services · topics</text>
    </g>
    <path d="M750 90 H798" class="arrow"/>
    <g transform="translate(800 54)">
      <rect width="205" height="72" fill="#fff6e9" stroke="#a95a13" class="box"/><text x="102" y="26" text-anchor="middle" class="sans label">Robot skills</text><text x="102" y="49" text-anchor="middle" class="sans small muted">navigate · dock · avoid</text>
    </g>
    <path d="M1009 90 H1057" class="arrow"/>
    <g transform="translate(1059 54)">
      <rect width="249" height="72" fill="#fff0f1" stroke="#9a3f67" class="box"/><text x="124" y="26" text-anchor="middle" class="sans label">Safety / supervisory layer</text><text x="124" y="49" text-anchor="middle" class="sans small muted">e-stop · watchdog · command limits</text>
    </g>
  </g>

  <!-- runtime loop -->
  <g transform="translate(36 546)">
    <rect width="1328" height="230" class="panel"/>
    <text x="18" y="30" class="serif h2">C. Runtime tick–act–observe loop</text>
    <text x="1124" y="30" class="sans small muted">online / repeated at control rate</text>

    <g transform="translate(20 58)">
      <rect width="145" height="80" fill="#eef4fa" stroke="#6d8fb3" class="box"/><text x="72" y="25" text-anchor="middle" class="sans label">Sensors</text><text x="72" y="47" text-anchor="middle" class="sans small">LiDAR · IMU</text><text x="72" y="64" text-anchor="middle" class="sans small">battery · odom</text>
    </g>
    <path d="M168 99 H215" class="arrow"/>
    <g transform="translate(217 58)">
      <rect width="165" height="80" fill="#f4f7fa" stroke="#718096" class="box"/><text x="82" y="25" text-anchor="middle" class="sans label">State update</text><text x="82" y="47" text-anchor="middle" class="sans small">estimate xₜ</text><text x="82" y="64" text-anchor="middle" class="sans small">write blackboard</text>
    </g>
    <path d="M385 99 H432" class="arrow"/>
    <g transform="translate(434 58)">
      <rect width="165" height="80" fill="#eef8f3" stroke="#28775f" class="box"/><text x="82" y="25" text-anchor="middle" class="sans label">Root tick</text><text x="82" y="47" text-anchor="middle" class="sans small">evaluate priority</text><text x="82" y="64" text-anchor="middle" class="sans small">propagate S/F/R</text>
    </g>
    <path d="M602 99 H649" class="arrow"/>
    <g transform="translate(651 58)">
      <rect width="166" height="80" fill="#fff7e8" stroke="#a95a13" class="box"/><text x="83" y="25" text-anchor="middle" class="sans label">Active skill</text><text x="83" y="47" text-anchor="middle" class="sans small">send/continue goal</text><text x="83" y="64" text-anchor="middle" class="sans small">or halt previous skill</text>
    </g>
    <path d="M820 99 H867" class="arrow"/>
    <g transform="translate(869 58)">
      <rect width="165" height="80" fill="#f3f0fb" stroke="#6847a5" class="box"/><text x="82" y="25" text-anchor="middle" class="sans label">Controllers</text><text x="82" y="47" text-anchor="middle" class="sans small">velocity / trajectory</text><text x="82" y="64" text-anchor="middle" class="sans small">actuator command</text>
    </g>
    <path d="M1037 99 H1084" class="arrow"/>
    <g transform="translate(1086 58)">
      <rect width="222" height="80" fill="#f8fafc" stroke="#64748b" class="box"/><text x="111" y="25" text-anchor="middle" class="sans label">Robot + environment</text><text x="111" y="47" text-anchor="middle" class="sans small">motion changes world</text><text x="111" y="64" text-anchor="middle" class="sans small">xₜ → xₜ₊₁</text>
    </g>

    <path d="M1197 142 C1197 204 91 204 91 142" class="feedback"/>
    <text x="450" y="191" class="sans small" fill="#245b88">feedback: new measurements can change the active subtree on the next root tick</text>

    <g transform="translate(20 158)">
      <text x="0" y="0" class="sans label">Failure handling:</text>
      <text x="112" y="0" class="sans small">skill Failure / timeout → recovery Fallback → retry, clear costmap, replan, safe stop, or escalate to supervisor</text>
    </g>
  </g>

  <text x="36" y="807" class="sans small muted">Repository-authored engineering synthesis. The exact middleware and node APIs vary by implementation, but the design/runtime separation and feedback structure are representative of practical robot BT systems.</text>
</svg>