<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920" role="img" aria-labelledby="title desc">
  <title id="title">Practical behavior-tree architecture with data flow and status propagation</title>
  <desc id="desc">Technical overview of a mobile robot behavior tree connected to sensors, a blackboard, robot skills, actuator commands, recovery branches, and an execution trace across several ticks.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#245b88"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#17202a}.sans{font-family:Arial,Helvetica,sans-serif;fill:#27313b}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#5f6b78}.h2{font-size:20px;font-weight:700}.label{font-size:14px;font-weight:700}.small{font-size:12px}.body{font-size:14px}.muted{fill:#66727f}.edge{stroke:#7b8794;stroke-width:1.6;fill:none}.statusEdge{stroke:#245b88;stroke-width:2.5;fill:none;marker-end:url(#blueArrow)}.dataEdge{stroke:#64748b;stroke-width:1.5;stroke-dasharray:6 5;fill:none;marker-end:url(#arrow)}.node{stroke-width:1.4}.panel{fill:#fbfcfd;stroke:#cbd2da}.mono{font-family:'Courier New',monospace;font-size:12px;fill:#26323d}.tickCell{font-family:Arial,Helvetica,sans-serif;font-size:12px}
    </style>
  </defs>
  <rect width="1400" height="920" fill="#ffffff"/>
  <text x="36" y="46" class="serif title">Behavior tree as a practical robot executive</text>
  <text x="36" y="75" class="sans subtitle">Control-flow, shared data, robot skills, status propagation, and recovery interact on every tick.</text>

  <!-- sensor and blackboard lane -->
  <g transform="translate(36 108)">
    <rect width="1328" height="132" class="panel"/>
    <text x="18" y="28" class="serif h2">A. World state and shared data</text>

    <g transform="translate(20 48)">
      <rect width="142" height="62" fill="#eef4fa" stroke="#6d8fb3"/><text x="71" y="24" text-anchor="middle" class="sans label">Sensors</text><text x="71" y="44" text-anchor="middle" class="sans small muted">LiDAR · battery · odometry</text>
    </g>
    <path d="M170 79 H244" class="dataEdge"/>
    <g transform="translate(246 39)">
      <rect width="230" height="80" fill="#f4f7fa" stroke="#8795a3"/>
      <text x="14" y="23" class="sans label">State estimator / monitors</text>
      <text x="14" y="45" class="sans small muted">obstacle distance · pose · charge</text>
      <text x="14" y="64" class="sans small muted">goal validity · localization health</text>
    </g>
    <path d="M478 79 H542" class="dataEdge"/>
    <g transform="translate(544 29)">
      <rect width="332" height="100" fill="#f8fafc" stroke="#64748b"/>
      <text x="15" y="23" class="sans label">Blackboard / data ports  xₜ</text>
      <text x="15" y="45" class="mono">battery = 0.42     obstacle = true</text>
      <text x="15" y="64" class="mono">goal = (8.2, 3.1)    path_valid = true</text>
      <text x="15" y="83" class="mono">nav_state = RUNNING   recovery = none</text>
    </g>
    <path d="M878 79 H938" class="dataEdge"/>
    <g transform="translate(940 39)">
      <rect width="168" height="80" fill="#eef8f3" stroke="#28775f"/>
      <text x="84" y="27" text-anchor="middle" class="sans label">BT tick engine</text>
      <text x="84" y="49" text-anchor="middle" class="sans small muted">reads xₜ, returns status</text>
      <text x="84" y="66" text-anchor="middle" class="sans small muted">selects active skill</text>
    </g>
    <path d="M1110 79 H1170" class="dataEdge"/>
    <g transform="translate(1172 48)">
      <rect width="136" height="62" fill="#fff6e9" stroke="#a95a13"/><text x="68" y="24" text-anchor="middle" class="sans label">Robot skills</text><text x="68" y="44" text-anchor="middle" class="sans small muted">nav · dock · avoid</text>
    </g>
  </g>

  <!-- tree -->
  <g transform="translate(36 265)">
    <rect width="900" height="520" class="panel"/>
    <text x="18" y="30" class="serif h2">B. Prioritized behavior tree</text>
    <text x="18" y="54" class="sans small muted">Higher-priority safety/recovery branches are evaluated before nominal mission execution.</text>

    <!-- edges root to branches -->
    <path d="M450 112 V146 H164 V176" class="edge"/><path d="M450 146 H450 V176" class="edge"/><path d="M450 146 H738 V176" class="edge"/>
    <path d="M164 226 V258 H90 V286" class="edge"/><path d="M164 258 H238 V286" class="edge"/>
    <path d="M450 226 V258 H376 V286" class="edge"/><path d="M450 258 H524 V286" class="edge"/>
    <path d="M738 226 V258 H638 V286" class="edge"/><path d="M738 258 H738 V286" class="edge"/><path d="M738 258 H838 V286" class="edge"/>
    <path d="M738 344 V377 H682 V405" class="edge"/><path d="M738 377 H794 V405" class="edge"/>

    <!-- nodes -->
    <rect x="354" y="70" width="192" height="54" class="node" fill="#e7eff6" stroke="#245b88"/>
    <text x="450" y="92" text-anchor="middle" class="sans label">Reactive Fallback</text><text x="450" y="110" text-anchor="middle" class="sans small muted">priority ordered</text>

    <rect x="98" y="176" width="132" height="50" class="node" fill="#eef8f3" stroke="#28775f"/>
    <text x="164" y="205" text-anchor="middle" class="sans label">Sequence</text>
    <text x="164" y="244" text-anchor="middle" class="sans small muted">critical battery recovery</text>

    <rect x="384" y="176" width="132" height="50" class="node" fill="#eef8f3" stroke="#28775f"/>
    <text x="450" y="205" text-anchor="middle" class="sans label">Sequence</text>
    <text x="450" y="244" text-anchor="middle" class="sans small muted">obstacle recovery</text>

    <rect x="672" y="176" width="132" height="50" class="node" fill="#eef8f3" stroke="#28775f"/>
    <text x="738" y="205" text-anchor="middle" class="sans label">Sequence</text>
    <text x="738" y="244" text-anchor="middle" class="sans small muted">nominal mission</text>

    <g class="sans">
      <rect x="34" y="286" width="112" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="90" y="309" text-anchor="middle" class="label">Condition</text><text x="90" y="328" text-anchor="middle" class="small">BatteryCritical?</text>
      <rect x="182" y="286" width="112" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="238" y="309" text-anchor="middle" class="label">Action</text><text x="238" y="328" text-anchor="middle" class="small">DockAndCharge</text>
      <rect x="320" y="286" width="112" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="376" y="309" text-anchor="middle" class="label">Condition</text><text x="376" y="328" text-anchor="middle" class="small">ObstacleNear?</text>
      <rect x="468" y="286" width="112" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="524" y="309" text-anchor="middle" class="label">Action</text><text x="524" y="328" text-anchor="middle" class="small">AvoidObstacle</text>
      <rect x="582" y="286" width="112" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="638" y="309" text-anchor="middle" class="label">Condition</text><text x="638" y="328" text-anchor="middle" class="small">GoalValid?</text>
      <rect x="682" y="286" width="112" height="58" class="node" fill="#f3f0fb" stroke="#6847a5"/><text x="738" y="309" text-anchor="middle" class="label">Fallback</text><text x="738" y="328" text-anchor="middle" class="small">navigation recovery</text>
      <rect x="802" y="286" width="72" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="838" y="309" text-anchor="middle" class="label">Cond.</text><text x="838" y="328" text-anchor="middle" class="small">AtGoal?</text>
      <rect x="626" y="405" width="112" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="682" y="428" text-anchor="middle" class="label">Action</text><text x="682" y="447" text-anchor="middle" class="small">FollowPath</text>
      <rect x="750" y="405" width="88" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="794" y="428" text-anchor="middle" class="label">Action</text><text x="794" y="447" text-anchor="middle" class="small">Replan</text>
    </g>

    <!-- current tick emphasis -->
    <path d="M450 126 V150 H450 V170" class="statusEdge"/>
    <path d="M450 228 V270 H376 V280" class="statusEdge"/>
    <path d="M376 348 H524 V350" class="statusEdge"/>
    <rect x="311" y="277" width="278" height="76" fill="none" stroke="#245b88" stroke-width="3"/>
    <text x="319" y="373" class="sans small" fill="#245b88">current tick: ObstacleNear? = Success → AvoidObstacle = Running</text>

    <!-- return status legend -->
    <g transform="translate(24 478)">
      <text x="0" y="0" class="sans label">Return interface:</text>
      <rect x="116" y="-13" width="14" height="14" fill="#4b9a62"/><text x="137" y="0" class="sans small">Success</text>
      <rect x="207" y="-13" width="14" height="14" fill="#c94a4a"/><text x="228" y="0" class="sans small">Failure</text>
      <rect x="294" y="-13" width="14" height="14" fill="#2f6fbd"/><text x="315" y="0" class="sans small">Running</text>
      <text x="408" y="0" class="serif body">status(v,t) ∈ {S,F,R}</text>
    </g>
  </g>

  <!-- right detail -->
  <g transform="translate(958 265)">
    <rect width="406" height="520" class="panel"/>
    <text x="18" y="30" class="serif h2">C. Tick semantics and trace</text>

    <text x="18" y="64" class="sans label">Memoryless Sequence(c₁…cₙ)</text>
    <text x="18" y="87" class="mono">for child in order:</text>
    <text x="32" y="106" class="mono">if child = F → return F</text>
    <text x="32" y="125" class="mono">if child = R → return R</text>
    <text x="18" y="144" class="mono">return S</text>

    <text x="18" y="177" class="sans label">Memoryless Fallback(c₁…cₙ)</text>
    <text x="18" y="200" class="mono">for child in order:</text>
    <text x="32" y="219" class="mono">if child = S → return S</text>
    <text x="32" y="238" class="mono">if child = R → return R</text>
    <text x="18" y="257" class="mono">return F</text>

    <line x1="18" y1="278" x2="388" y2="278" stroke="#d7dde4"/>
    <text x="18" y="310" class="sans label">Execution trace (20 Hz control loop)</text>

    <g transform="translate(18 326)">
      <rect width="370" height="142" fill="#fff" stroke="#cbd2da"/>
      <path d="M0 28 H370 M0 56 H370 M0 84 H370 M0 112 H370" stroke="#e1e5ea"/>
      <path d="M44 0 V142 M112 0 V142 M211 0 V142 M301 0 V142" stroke="#e1e5ea"/>
      <text x="8" y="19" class="tickCell" font-weight="700">tick</text><text x="58" y="19" class="tickCell" font-weight="700">obstacle</text><text x="126" y="19" class="tickCell" font-weight="700">active branch</text><text x="222" y="19" class="tickCell" font-weight="700">leaf</text><text x="311" y="19" class="tickCell" font-weight="700">root</text>
      <text x="9" y="47" class="tickCell">41</text><text x="67" y="47" class="tickCell">false</text><text x="126" y="47" class="tickCell">mission</text><text x="222" y="47" class="tickCell">FollowPath:R</text><text x="314" y="47" class="tickCell" fill="#2f6fbd">R</text>
      <text x="9" y="75" class="tickCell">42</text><text x="67" y="75" class="tickCell">true</text><text x="126" y="75" class="tickCell">recovery</text><text x="222" y="75" class="tickCell">Avoid:R</text><text x="314" y="75" class="tickCell" fill="#2f6fbd">R</text>
      <text x="9" y="103" class="tickCell">43</text><text x="67" y="103" class="tickCell">true</text><text x="126" y="103" class="tickCell">recovery</text><text x="222" y="103" class="tickCell">Avoid:S</text><text x="314" y="103" class="tickCell" fill="#4b9a62">S</text>
      <text x="9" y="131" class="tickCell">44</text><text x="67" y="131" class="tickCell">false</text><text x="126" y="131" class="tickCell">mission</text><text x="222" y="131" class="tickCell">FollowPath:R</text><text x="314" y="131" class="tickCell" fill="#2f6fbd">R</text>
    </g>

    <text x="18" y="494" class="sans small muted">Repeated root evaluation creates preemption without enumerating explicit state-transition edges.</text>
  </g>

  <!-- action interface -->
  <g transform="translate(36 808)">
    <rect width="1328" height="82" class="panel"/>
    <text x="18" y="26" class="serif h2">D. Action boundary</text>
    <text x="18" y="53" class="sans body">BT selects a skill → skill client sends command → controller/actuator changes the world → sensors update xₜ₊₁ → next root tick may continue, halt, retry, or switch subtree.</text>
    <path d="M786 60 H1290" class="dataEdge"/>
  </g>

  <text x="36" y="911" class="sans small muted">Repository-authored synthesis of standard robotics BT semantics and software architecture patterns; not a reproduction of a source figure.</text>
</svg>