<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Behavior tree foundations: structure and execution semantics</title>
  <desc id="desc">Academic overview showing a rooted behavior tree for a mobile robot, node types, status propagation, and simplified Sequence and Fallback return rules.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#718096"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#17202a}.sans{font-family:Arial,Helvetica,sans-serif;fill:#27313b}.small{font-size:14px}.body{font-size:16px}.label{font-size:15px;font-weight:700}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#5f6b78}.node{stroke-width:1.5}.edge{stroke:#718096;stroke-width:1.6;fill:none}.tick{stroke:#245b88;stroke-width:3;fill:none;marker-end:url(#arrow)}.rule{font-size:19px}.muted{fill:#65717d}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="42" y="48" class="serif title">Behavior tree foundations</text>
  <text x="42" y="76" class="sans subtitle">A rooted executable tree whose nodes return Success, Failure, or Running on each tick.</text>

  <g transform="translate(42 112)">
    <rect x="0" y="0" width="725" height="594" fill="#fbfcfd" stroke="#cbd2da"/>
    <text x="24" y="34" class="serif" font-size="20" font-weight="700">1. Executable data structure</text>
    <text x="24" y="60" class="sans body muted">Example: mobile robot prioritizes charging, then navigation.</text>

    <line x1="355" y1="125" x2="192" y2="205" class="edge"/>
    <line x1="355" y1="125" x2="520" y2="205" class="edge"/>
    <line x1="192" y1="255" x2="92" y2="335" class="edge"/>
    <line x1="192" y1="255" x2="292" y2="335" class="edge"/>
    <line x1="520" y1="255" x2="420" y2="335" class="edge"/>
    <line x1="520" y1="255" x2="620" y2="335" class="edge"/>

    <rect x="265" y="94" width="180" height="62" class="node" fill="#e7eff6" stroke="#245b88"/>
    <text x="355" y="119" text-anchor="middle" class="sans label">Fallback / Selector</text>
    <text x="355" y="140" text-anchor="middle" class="sans small muted">first successful/running child</text>

    <rect x="112" y="205" width="160" height="50" class="node" fill="#edf6f1" stroke="#28775f"/>
    <text x="192" y="235" text-anchor="middle" class="sans label">Sequence</text>
    <rect x="440" y="205" width="160" height="50" class="node" fill="#edf6f1" stroke="#28775f"/>
    <text x="520" y="235" text-anchor="middle" class="sans label">Sequence</text>

    <rect x="25" y="335" width="134" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/>
    <text x="92" y="359" text-anchor="middle" class="sans label">Condition</text>
    <text x="92" y="379" text-anchor="middle" class="sans small">BatteryLow?</text>
    <rect x="225" y="335" width="134" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/>
    <text x="292" y="359" text-anchor="middle" class="sans label">Action</text>
    <text x="292" y="379" text-anchor="middle" class="sans small">Recharge</text>
    <rect x="353" y="335" width="134" height="58" class="node" fill="#fff0f1" stroke="#b84d5d"/>
    <text x="420" y="359" text-anchor="middle" class="sans label">Condition</text>
    <text x="420" y="379" text-anchor="middle" class="sans small">GoalKnown?</text>
    <rect x="553" y="335" width="134" height="58" class="node" fill="#fff6e9" stroke="#a95a13"/>
    <text x="620" y="359" text-anchor="middle" class="sans label">Action</text>
    <text x="620" y="379" text-anchor="middle" class="sans small">Navigate</text>

    <path d="M355 164 L355 184 L192 184 L192 196" class="tick"/>
    <text x="278" y="177" class="sans small" fill="#245b88">tick</text>

    <g transform="translate(24 438)">
      <text x="0" y="0" class="serif" font-size="18" font-weight="700">Node interface</text>
      <text x="0" y="31" class="serif rule">status(v,t) ∈ { Success, Failure, Running }</text>
      <text x="0" y="60" class="sans small muted">Conditions usually terminate immediately; actions may remain Running across many ticks.</text>
      <g transform="translate(0 91)">
        <rect x="0" y="0" width="16" height="16" fill="#4b9a62"/><text x="25" y="14" class="sans small">Success — objective satisfied</text>
        <rect x="220" y="0" width="16" height="16" fill="#c94a4a"/><text x="245" y="14" class="sans small">Failure — objective not satisfied</text>
        <rect x="478" y="0" width="16" height="16" fill="#2f6fbd"/><text x="503" y="14" class="sans small">Running — still executing</text>
      </g>
    </g>
  </g>

  <g transform="translate(794 112)">
    <rect x="0" y="0" width="364" height="594" fill="#ffffff" stroke="#cbd2da"/>
    <text x="24" y="34" class="serif" font-size="20" font-weight="700">2. Return semantics</text>
    <text x="24" y="62" class="sans small muted">Simplified memoryless forms.</text>

    <text x="24" y="111" class="sans label" fill="#28775f">Sequence(c₁,…,cₙ)</text>
    <text x="24" y="143" class="serif body">Failure</text><text x="122" y="143" class="sans small muted">if first decisive child fails</text>
    <text x="24" y="174" class="serif body">Running</text><text x="122" y="174" class="sans small muted">if first unresolved child runs</text>
    <text x="24" y="205" class="serif body">Success</text><text x="122" y="205" class="sans small muted">if every child succeeds</text>

    <line x1="24" y1="234" x2="340" y2="234" stroke="#d7dde4"/>
    <text x="24" y="276" class="sans label" fill="#245b88">Fallback(c₁,…,cₙ)</text>
    <text x="24" y="308" class="serif body">Success</text><text x="122" y="308" class="sans small muted">if first decisive child succeeds</text>
    <text x="24" y="339" class="serif body">Running</text><text x="122" y="339" class="sans small muted">if first unresolved child runs</text>
    <text x="24" y="370" class="serif body">Failure</text><text x="122" y="370" class="sans small muted">if every child fails</text>

    <line x1="24" y1="399" x2="340" y2="399" stroke="#d7dde4"/>
    <text x="24" y="441" class="serif" font-size="18" font-weight="700">3. Why repeated ticks matter</text>
    <text x="24" y="473" class="sans small">At time t:</text>
    <text x="100" y="473" class="serif body">BatteryLow = false</text>
    <text x="24" y="505" class="sans small">Navigate returns</text>
    <text x="140" y="505" class="serif body" fill="#2f6fbd">Running</text>
    <text x="24" y="537" class="sans small">At time t + Δt:</text>
    <text x="125" y="537" class="serif body">BatteryLow = true</text>
    <path d="M24 559 L320 559" stroke="#245b88" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="24" y="586" class="sans small" fill="#245b88">Root re-evaluation can switch execution to Recharge.</text>
  </g>

  <text x="42" y="738" class="sans small muted">Figure: repository-authored synthesis of standard robotics BT semantics; see Marzinotto et al. (2014) and Colledanchise &amp; Ögren (2017).</text>
</svg>