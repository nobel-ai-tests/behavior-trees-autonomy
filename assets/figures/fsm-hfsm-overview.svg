<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Finite-State Machines and Hierarchical FSMs overview</title>
<desc id="desc">A robotics knowledge-base overview showing explicit states, guarded transitions, hierarchical substates, and why finite-state execution can be fast.</desc>
<defs><style>
text{font-family:Inter,Arial,sans-serif;fill:#10254b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#50627d}.h{font-size:22px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#53657c}.state{stroke:#3567a8;stroke-width:2}.arrow{stroke:#1b2738;stroke-width:2.4;fill:none;marker-end:url(#m)}
</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2738"/></marker></defs>
<rect width="1200" height="675" fill="#f8fbff"/><rect x="28" y="28" width="1144" height="619" fill="#fff" stroke="#c7d8eb" stroke-width="2"/>
<text x="600" y="76" text-anchor="middle" class="title">Finite-State Machines and Hierarchical FSMs</text><text x="600" y="108" text-anchor="middle" class="sub">Additional fast-decision resource — Behavior Trees remain the core architecture</text>
<rect x="60" y="145" width="265" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="82" y="184" class="h">Core idea</text><text x="82" y="222" class="t">One discrete active state</text><text x="82" y="248" class="t">Guard becomes true</text><text x="82" y="274" class="t">Transition to next state</text><rect x="82" y="305" width="220" height="74" fill="#fff" stroke="#98b8db"/><text x="192" y="336" text-anchor="middle" class="t">state + trigger</text><text x="192" y="362" text-anchor="middle" class="h">→ next state</text><text x="82" y="421" class="small">Fast because runtime work is</text><text x="82" y="443" class="small">usually a small set of guard</text><text x="82" y="465" class="small">checks plus one controller.</text><text x="82" y="510" class="small">Best fit: compact mode logic,</text><text x="82" y="532" class="small">protocols, local recovery.</text>
<rect x="352" y="145" width="535" height="420" fill="#fff" stroke="#b7cee8"/><text x="378" y="184" class="h">Execution structure</text>
<rect x="570" y="210" width="120" height="55" fill="#e8edf4" class="state"/><text x="630" y="244" text-anchor="middle" class="h">IDLE</text><rect x="727" y="210" width="120" height="55" fill="#dceeff" class="state"/><text x="787" y="244" text-anchor="middle" class="h">SEARCH</text><rect x="727" y="305" width="120" height="55" fill="#fff0cf" class="state"/><text x="787" y="339" text-anchor="middle" class="h">APPROACH</text><rect x="545" y="305" width="120" height="55" fill="#e0f5e6" class="state"/><text x="605" y="339" text-anchor="middle" class="h">GRASP</text><rect x="390" y="305" width="120" height="55" fill="#eee5ff" class="state"/><text x="450" y="339" text-anchor="middle" class="h">DELIVER</text><rect x="390" y="210" width="120" height="55" fill="#ffe1e5" class="state"/><text x="450" y="244" text-anchor="middle" class="h">RECOVER</text>
<path d="M690 237H727" class="arrow"/><text x="709" y="224" text-anchor="middle" class="small">start</text><path d="M787 265V305" class="arrow"/><text x="800" y="288" class="small">found</text><path d="M727 332H665" class="arrow"/><text x="696" y="319" text-anchor="middle" class="small">at object</text><path d="M545 332H510" class="arrow"/><text x="528" y="319" text-anchor="middle" class="small">success</text><path d="M450 305V265" class="arrow"/><text x="462" y="288" class="small">failure</text><path d="M510 237H570" class="arrow"/><text x="540" y="224" text-anchor="middle" class="small">reset</text>
<rect x="390" y="405" width="457" height="125" fill="#fff9ec" stroke="#deb566" stroke-width="2"/><text x="410" y="434" class="t" font-weight="700">Hierarchical APPROACH state</text><rect x="425" y="458" width="105" height="48" fill="#fff" stroke="#9b8c72"/><text x="478" y="488" text-anchor="middle" class="t">PLAN PATH</text><rect x="565" y="458" width="105" height="48" fill="#fff" stroke="#9b8c72"/><text x="618" y="488" text-anchor="middle" class="t">FOLLOW</text><rect x="705" y="458" width="105" height="48" fill="#fff" stroke="#9b8c72"/><text x="758" y="488" text-anchor="middle" class="t">AVOID</text><path d="M530 482H565" class="arrow"/><path d="M670 482H705" class="arrow"/>
<rect x="915" y="145" width="225" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="938" y="184" class="h">Why it is fast</text><text x="938" y="228" class="t">• Cheap guard checks</text><text x="938" y="263" class="t">• Bounded transitions</text><text x="938" y="298" class="t">• Deterministic modes</text><text x="938" y="333" class="t">• Low memory overhead</text><line x1="938" y1="367" x2="1118" y2="367" stroke="#c2d3e5"/><text x="938" y="406" class="h">Trade-off</text><text x="938" y="442" class="t">State / transition</text><text x="938" y="468" class="t">explosion as behavior</text><text x="938" y="494" class="t">complexity grows.</text>
<text x="60" y="611" class="small">BT relationship: use FSMs as local mode controllers or leaves; keep the Behavior Tree as the compositional task executive.</text></svg>