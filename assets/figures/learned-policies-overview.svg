<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Learned Policies overview</title><desc id="desc">High-dimensional robot observations flow through a trained policy model to produce actions in one forward pass, with training separated from deployment.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#10254b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#50627d}.h{font-size:22px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#53657c}.arrow{stroke:#1b2738;stroke-width:2.4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2738"/></marker></defs><rect width="1200" height="675" fill="#f8fbff"/><rect x="28" y="28" width="1144" height="619" fill="#fff" stroke="#c7d8eb" stroke-width="2"/><text x="600" y="76" text-anchor="middle" class="title">Learned Policies</text><text x="600" y="108" text-anchor="middle" class="sub">Additional fast-decision resource — Behavior Trees remain the core architecture</text><rect x="60" y="145" width="260" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="82" y="184" class="h">Core idea</text><text x="82" y="222" class="t">Train a model to map</text><text x="82" y="248" class="t">observations to actions.</text><rect x="82" y="292" width="215" height="78" fill="#fff" stroke="#98b8db"/><text x="189" y="325" text-anchor="middle" class="t">observation</text><text x="189" y="354" text-anchor="middle" class="h">→ policy → action</text><text x="82" y="418" class="small">Most optimization happens</text><text x="82" y="440" class="small">during training; deployment</text><text x="82" y="462" class="small">can be a single forward pass.</text><text x="82" y="506" class="small">Powerful for rich sensor data</text><text x="82" y="528" class="small">and nonlinear behavior.</text><rect x="348" y="145" width="548" height="420" fill="#fff" stroke="#b7cee8"/><text x="374" y="184" class="h">Training and runtime pipeline</text><text x="382" y="220" class="small">observations</text><rect x="378" y="238" width="130" height="56" fill="#ffe1e5" stroke="#d75b68"/><text x="443" y="271" text-anchor="middle" class="t">CAMERA</text><rect x="378" y="311" width="130" height="56" fill="#e0f5e6" stroke="#55a66a"/><text x="443" y="344" text-anchor="middle" class="t">LIDAR</text><rect x="378" y="384" width="130" height="56" fill="#eee5ff" stroke="#8462c8"/><text x="443" y="417" text-anchor="middle" class="t">STATE EST.</text><path d="M508 266H580" class="arrow"/><path d="M508 339H580" class="arrow"/><path d="M508 412H580" class="arrow"/><rect x="580" y="278" width="150" height="125" fill="#e9f2ff" stroke="#3567a8" stroke-width="2"/><circle cx="622" cy="327" r="10" fill="#3567a8"/><circle cx="655" cy="307" r="10" fill="#3567a8"/><circle cx="688" cy="327" r="10" fill="#3567a8"/><line x1="632" y1="322" x2="645" y2="312" stroke="#3567a8" stroke-width="3"/><line x1="665" y1="312" x2="678" y2="322" stroke="#3567a8" stroke-width="3"/><text x="655" y="374" text-anchor="middle" class="h">POLICY</text><text x="655" y="394" text-anchor="middle" class="small">fast inference</text><path d="M730 340H782" class="arrow"/><text x="818" y="220" text-anchor="middle" class="small">actions</text><rect x="782" y="238" width="84" height="56" fill="#e0f5e6" stroke="#55a66a"/><text x="824" y="271" text-anchor="middle" class="t">STEER</text><rect x="782" y="311" width="84" height="56" fill="#fff0cf" stroke="#df9a28"/><text x="824" y="344" text-anchor="middle" class="t">SPEED</text><rect x="782" y="384" width="84" height="56" fill="#eee5ff" stroke="#8462c8"/><text x="824" y="417" text-anchor="middle" class="t">GRASP</text><rect x="400" y="474" width="175" height="55" fill="#eef5fc" stroke="#7ba3cc"/><text x="488" y="497" text-anchor="middle" class="t">IMITATION</text><text x="488" y="518" text-anchor="middle" class="small">demonstrations</text><rect x="595" y="474" width="175" height="55" fill="#fff1f2" stroke="#d75b68"/><text x="682" y="497" text-anchor="middle" class="t">REINFORCEMENT</text><text x="682" y="518" text-anchor="middle" class="small">interaction rewards</text><path d="M575 501H595" class="arrow"/><path d="M682 474V432H655" class="arrow"/><rect x="924" y="145" width="216" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="946" y="184" class="h">Why it is fast</text><text x="946" y="228" class="t">• One forward pass</text><text x="946" y="263" class="t">• Rich observations</text><text x="946" y="298" class="t">• Fixed runtime graph</text><text x="946" y="333" class="t">• Hardware acceleration</text><line x1="946" y1="367" x2="1116" y2="367" stroke="#c2d3e5"/><text x="946" y="406" class="h">Trade-off</text><text x="946" y="442" class="t">Verification, data,</text><text x="946" y="468" class="t">distribution shift,</text><text x="946" y="494" class="t">opaque failures.</text><text x="60" y="611" class="small">BT relationship: use learned policies as skills/leaves; let the Behavior Tree keep explicit task switching, recovery, and mission-level semantics.</text></svg>