<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">Planner-generated behavior tree workflow from Iovino et al.</title>
  <desc id="desc">Repository redraw of the planning example in Figure 8 of Iovino et al. 2022, showing goal checks, preconditions, navigation, grasping, and placement in a generated behavior tree.</desc>
  <defs>
    <style>
      .edge{stroke:#64748b;stroke-width:2;fill:none}.control{fill:#eef4f8;stroke:#245b88;stroke-width:2}.condition{fill:#fff;stroke:#28775f;stroke-width:2}.action{fill:#fff7e8;stroke:#a95a13;stroke-width:2}.label{font:16px ui-sans-serif,system-ui,sans-serif;fill:#17202a;text-anchor:middle}.symbol{font:bold 25px Georgia,serif;fill:#17202a;text-anchor:middle}.caption{font:14px ui-sans-serif,system-ui,sans-serif;fill:#475569;text-anchor:start}
    </style>
  </defs>
  <path class="edge" d="M590 82 V135 M590 135 H210 V205 M590 135 H570 V205 M590 135 H940 V205"/>
  <path class="edge" d="M570 245 V300 M570 300 H370 V365 M570 300 H570 V365 M570 300 H770 V365"/>
  <path class="edge" d="M370 405 V465 M370 465 H250 V525 M370 465 H490 V525"/>
  <path class="edge" d="M770 405 V465 M770 465 H680 V525 M770 465 H860 V525"/>

  <circle class="control" cx="590" cy="62" r="29"/><text class="symbol" x="590" y="71">?</text>
  <rect class="condition" x="105" y="205" width="210" height="52" rx="4"/><text class="label" x="210" y="236">Object at Goal?</text>
  <circle class="control" cx="570" cy="225" r="29"/><text class="symbol" x="570" y="234">→</text>
  <rect class="action" x="835" y="205" width="210" height="52" rx="4"/><text class="label" x="940" y="236">Place Object at Goal</text>

  <rect class="condition" x="275" y="365" width="190" height="52" rx="4"/><text class="label" x="370" y="396">Object in Gripper?</text>
  <circle class="control" cx="570" cy="385" r="29"/><text class="symbol" x="570" y="394">?</text>
  <rect class="condition" x="675" y="365" width="190" height="52" rx="4"/><text class="label" x="770" y="396">Near Goal?</text>

  <rect class="condition" x="155" y="525" width="190" height="52" rx="4"/><text class="label" x="250" y="556">Gripper Empty?</text>
  <rect class="action" x="395" y="525" width="190" height="52" rx="4"/><text class="label" x="490" y="556">Grasp Object</text>
  <rect class="condition" x="585" y="525" width="190" height="52" rx="4"/><text class="label" x="680" y="556">Free Path Exists?</text>
  <rect class="action" x="765" y="525" width="190" height="52" rx="4"/><text class="label" x="860" y="556">Move to Goal</text>

  <text class="caption" x="70" y="650">Planning workflow represented in the survey: a planner supplies goal/action/precondition information, and a conversion procedure expands it into a reactive BT.</text>
  <text class="caption" x="70" y="678">This is a condensed repository redraw of the structure shown in the paper’s Figure 8, not a reproduction of the original artwork.</text>
</svg>