<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">Model Predictive Control overview</title><desc id="desc">Current state, dynamics, costs, and constraints feed a short-horizon optimizer; the first control is applied and the process repeats.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#10254b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#50627d}.h{font-size:22px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#53657c}.arrow{stroke:#1b2738;stroke-width:2.4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2738"/></marker></defs><rect width="1200" height="675" fill="#f8fbff"/><rect x="28" y="28" width="1144" height="619" fill="#fff" stroke="#c7d8eb" stroke-width="2"/><text x="600" y="76" text-anchor="middle" class="title">Model Predictive Control</text><text x="600" y="108" text-anchor="middle" class="sub">Additional fast-decision resource — Behavior Trees remain the core architecture</text><rect x="60" y="145" width="260" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="82" y="184" class="h">Core idea</text><text x="82" y="222" class="t">Predict a short horizon,</text><text x="82" y="248" class="t">optimize controls, apply</text><text x="82" y="274" class="t">only the first control.</text><rect x="82" y="310" width="215" height="95" fill="#fff" stroke="#98b8db"/><text x="189" y="343" text-anchor="middle" class="t">predict → optimize</text><text x="189" y="372" text-anchor="middle" class="h">→ apply u₀</text><text x="189" y="395" text-anchor="middle" class="small">measure and repeat</text><text x="82" y="454" class="small">Fast when the horizon and</text><text x="82" y="476" class="small">model are engineered to meet</text><text x="82" y="498" class="small">the control-cycle deadline.</text><rect x="348" y="145" width="548" height="420" fill="#fff" stroke="#b7cee8"/><text x="374" y="184" class="h">Receding-horizon execution</text><rect x="378" y="248" width="118" height="74" fill="#dceeff" stroke="#397bc0" stroke-width="2"/><text x="437" y="277" text-anchor="middle" class="t">CURRENT</text><text x="437" y="300" text-anchor="middle" class="h">STATE xₜ</text><rect x="535" y="220" width="140" height="62" fill="#e0f5e6" stroke="#55a66a"/><text x="605" y="247" text-anchor="middle" class="t">DYNAMICS</text><text x="605" y="269" text-anchor="middle" class="small">xₖ₊₁=f(xₖ,uₖ)</text><rect x="535" y="306" width="140" height="62" fill="#ffe1e5" stroke="#d75b68"/><text x="605" y="333" text-anchor="middle" class="t">COST +</text><text x="605" y="355" text-anchor="middle" class="small">constraints</text><path d="M496 285H535" class="arrow"/><path d="M496 285V337H535" class="arrow"/><rect x="718" y="248" width="145" height="96" fill="#eee5ff" stroke="#8462c8" stroke-width="2"/><text x="790" y="280" text-anchor="middle" class="t">SHORT-HORIZON</text><text x="790" y="306" text-anchor="middle" class="h">OPTIMIZER</text><text x="790" y="329" text-anchor="middle" class="small">u₀,u₁,…,uH</text><path d="M675 251H718" class="arrow"/><path d="M675 337H718" class="arrow"/><rect x="710" y="402" width="160" height="60" fill="#fff0cf" stroke="#df9a28" stroke-width="2"/><text x="790" y="428" text-anchor="middle" class="t">APPLY FIRST</text><text x="790" y="450" text-anchor="middle" class="h">CONTROL u₀</text><path d="M790 344V402" class="arrow"/><path d="M710 432H650V500H437V322" class="arrow"/><text x="545" y="523" text-anchor="middle" class="small">execute → measure new state → solve again</text><rect x="924" y="145" width="216" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="946" y="184" class="h">Why it is fast</text><text x="946" y="228" class="t">• Short horizon</text><text x="946" y="263" class="t">• Warm starts</text><text x="946" y="298" class="t">• Bounded local solve</text><text x="946" y="333" class="t">• Replans every cycle</text><line x1="946" y1="367" x2="1116" y2="367" stroke="#c2d3e5"/><text x="946" y="406" class="h">Trade-off</text><text x="946" y="442" class="t">Optimization cost,</text><text x="946" y="468" class="t">model error, and</text><text x="946" y="494" class="t">infeasibility.</text><text x="60" y="611" class="small">BT relationship: the Behavior Tree decides which skill runs; MPC supplies continuous controls inside trajectory, docking, flight, or manipulation leaves.</text></svg>