<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Reactive Architectures and Subsumption overview</title><desc id="desc">Layered reactive behaviors receive sensor inputs, higher-priority behaviors suppress lower layers, and the selected command goes directly to the robot.</desc><defs><style>text{font-family:Inter,Arial,sans-serif;fill:#10254b}.title{font-size:38px;font-weight:700}.sub{font-size:18px;fill:#50627d}.h{font-size:22px;font-weight:700}.t{font-size:16px}.small{font-size:14px;fill:#53657c}.arrow{stroke:#1b2738;stroke-width:2.4;fill:none;marker-end:url(#m)}</style><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2738"/></marker></defs>
<rect width="1200" height="675" fill="#f8fbff"/><rect x="28" y="28" width="1144" height="619" fill="#fff" stroke="#c7d8eb" stroke-width="2"/><text x="600" y="76" text-anchor="middle" class="title">Reactive Architectures and Subsumption</text><text x="600" y="108" text-anchor="middle" class="sub">Additional fast-decision resource — Behavior Trees remain the core architecture</text>
<rect x="60" y="145" width="260" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="82" y="184" class="h">Core idea</text><text x="82" y="222" class="t">Behaviors react directly</text><text x="82" y="248" class="t">to current sensor state.</text><text x="82" y="290" class="t">Higher-priority layers</text><text x="82" y="316" class="t">suppress lower layers.</text><rect x="82" y="350" width="215" height="82" fill="#fff" stroke="#98b8db"/><text x="189" y="382" text-anchor="middle" class="t">sense → behaviors</text><text x="189" y="411" text-anchor="middle" class="h">→ arbitrate → act</text><text x="82" y="478" class="small">Minimal global planning.</text><text x="82" y="503" class="small">Strong local responsiveness.</text>
<rect x="348" y="145" width="548" height="420" fill="#fff" stroke="#b7cee8"/><text x="374" y="184" class="h">Layered execution structure</text><text x="382" y="219" class="small">sensor inputs</text><rect x="378" y="238" width="140" height="58" fill="#ffe1e5" stroke="#d75b68"/><text x="448" y="264" text-anchor="middle" class="t">bumper /</text><text x="448" y="285" text-anchor="middle" class="t">emergency</text><rect x="378" y="322" width="140" height="58" fill="#eee5ff" stroke="#8462c8"/><text x="448" y="348" text-anchor="middle" class="t">proximity</text><text x="448" y="369" text-anchor="middle" class="t">sensors</text><rect x="378" y="406" width="140" height="58" fill="#e0f5e6" stroke="#55a66a"/><text x="448" y="432" text-anchor="middle" class="t">goal</text><text x="448" y="453" text-anchor="middle" class="t">direction</text>
<text x="617" y="219" text-anchor="middle" class="small">behavior layers — highest priority on top</text><rect x="560" y="238" width="255" height="52" fill="#ffe1e5" stroke="#d75b68" stroke-width="2"/><text x="688" y="271" text-anchor="middle" class="h">EMERGENCY STOP</text><rect x="560" y="310" width="255" height="52" fill="#fff0cf" stroke="#df9a28" stroke-width="2"/><text x="688" y="343" text-anchor="middle" class="h">AVOID OBSTACLE</text><rect x="560" y="382" width="255" height="52" fill="#dceeff" stroke="#397bc0" stroke-width="2"/><text x="688" y="415" text-anchor="middle" class="h">FOLLOW GOAL</text><rect x="560" y="454" width="255" height="52" fill="#e0f5e6" stroke="#55a66a" stroke-width="2"/><text x="688" y="487" text-anchor="middle" class="h">WANDER</text><path d="M518 267H560" class="arrow"/><path d="M518 351H560" class="arrow"/><path d="M518 435H560" class="arrow"/><path d="M688 290V310" class="arrow"/><path d="M688 362V382" class="arrow"/><path d="M688 434V454" class="arrow"/><text x="706" y="303" class="small">suppresses</text><text x="706" y="375" class="small">suppresses</text><text x="706" y="447" class="small">suppresses</text><path d="M815 370H858" class="arrow"/><rect x="830" y="398" width="48" height="74" fill="#eef2f6" stroke="#687990"/><circle cx="842" cy="484" r="12" fill="#45566c"/><circle cx="866" cy="484" r="12" fill="#45566c"/><text x="854" y="425" text-anchor="middle" class="small">robot</text><text x="854" y="446" text-anchor="middle" class="small">command</text>
<rect x="924" y="145" width="216" height="420" fill="#eef5fc" stroke="#b7cee8"/><text x="946" y="184" class="h">Why it is fast</text><text x="946" y="228" class="t">• Direct mapping</text><text x="946" y="263" class="t">• Parallel behaviors</text><text x="946" y="298" class="t">• Simple arbitration</text><text x="946" y="333" class="t">• Fast overrides</text><line x1="946" y1="367" x2="1116" y2="367" stroke="#c2d3e5"/><text x="946" y="406" class="h">Trade-off</text><text x="946" y="442" class="t">Weak long-horizon</text><text x="946" y="468" class="t">coordination and</text><text x="946" y="494" class="t">global reasoning.</text><text x="60" y="611" class="small">BT relationship: keep reactive safety/control layers below the BT, or encode priority reactions as high-priority BT branches.</text></svg>