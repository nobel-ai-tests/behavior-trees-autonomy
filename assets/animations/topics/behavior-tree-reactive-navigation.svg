<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">Practical reactive navigation behavior-tree execution</title>
  <desc id="desc">Animated mobile robot mission showing nominal navigation, dynamic obstacle detection, preemption, obstacle avoidance, replanning, and resumed navigation while the behavior tree, blackboard state, and event timeline update in synchronization.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#17202a}.sans{font-family:Arial,Helvetica,sans-serif;fill:#27313b}.title{font-size:29px;font-weight:700}.subtitle{font-size:17px;fill:#5f6b78}.h2{font-size:19px;font-weight:700}.label{font-size:13px;font-weight:700}.small{font-size:11px}.body{font-size:13px}.muted{fill:#66727f}.panel{fill:#fbfcfd;stroke:#cbd2da}.edge{stroke:#7b8794;stroke-width:1.5;fill:none}.node{stroke-width:1.3}.mono{font-family:'Courier New',monospace;font-size:11px;fill:#26323d}.phase{opacity:0}.hi{fill:none;stroke-width:4}.event{font-family:Arial,Helvetica,sans-serif;font-size:12px}.animated{}
      @media (prefers-reduced-motion: reduce){.animated{display:none}.reduced{display:inline!important}}
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e7ebef" stroke-width="1"/></pattern>
  </defs>

  <rect width="1400" height="860" fill="#fff"/>
  <text x="36" y="46" class="serif title">Reactive mobile-robot execution: tick, preempt, recover, resume</text>
  <text x="36" y="75" class="sans subtitle">A realistic control-cycle example linking environment state, blackboard updates, active BT nodes, action halting, and replanning.</text>

  <!-- Environment -->
  <g transform="translate(36 108)">
    <rect width="690" height="530" class="panel"/>
    <text x="18" y="30" class="serif h2">A. Robot and environment</text>
    <text x="18" y="52" class="sans small muted">Warehouse aisle · differential-drive robot · dynamic pallet truck crossing the planned path</text>

    <g transform="translate(18 72)">
      <rect width="654" height="350" fill="url(#grid)" stroke="#d4dae1"/>
      <!-- shelves -->
      <g fill="#e9edf1" stroke="#aeb8c3">
        <rect x="42" y="22" width="112" height="44"/><rect x="190" y="22" width="112" height="44"/><rect x="338" y="22" width="112" height="44"/>
        <rect x="42" y="278" width="112" height="44"/><rect x="190" y="278" width="112" height="44"/><rect x="338" y="278" width="112" height="44"/>
      </g>
      <text x="98" y="49" text-anchor="middle" class="sans small muted">shelf A</text><text x="246" y="49" text-anchor="middle" class="sans small muted">shelf B</text><text x="394" y="49" text-anchor="middle" class="sans small muted">shelf C</text>
      <text x="98" y="304" text-anchor="middle" class="sans small muted">shelf D</text><text x="246" y="304" text-anchor="middle" class="sans small muted">shelf E</text><text x="394" y="304" text-anchor="middle" class="sans small muted">shelf F</text>

      <!-- nominal path -->
      <path d="M70 220 C145 216 210 210 285 202 C355 195 405 175 465 142 C520 111 566 100 610 92" fill="none" stroke="#9eb2c6" stroke-width="4" stroke-dasharray="9 7"/>
      <path d="M288 202 C314 171 347 149 390 141 C430 133 449 141 465 142" fill="none" stroke="#d9a15b" stroke-width="4" stroke-dasharray="6 5" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.42;0.46;0.64;0.68;1" dur="16s" repeatCount="indefinite"/>
      </path>

      <!-- goal -->
      <circle cx="610" cy="92" r="17" fill="#dff0e5" stroke="#28775f" stroke-width="2"/><path d="M610 73 V45" stroke="#28775f" stroke-width="2"/><path d="M610 45 l24 9 -24 9z" fill="#28775f"/>
      <text x="610" y="31" text-anchor="middle" class="sans small" fill="#28775f">inspection goal</text>

      <!-- dynamic obstacle -->
      <g class="animated">
        <g>
          <rect x="-24" y="-14" width="48" height="28" fill="#f4caca" stroke="#b84d5d" stroke-width="2"/>
          <rect x="-31" y="-10" width="7" height="20" fill="#8d99a5"/><rect x="24" y="-10" width="7" height="20" fill="#8d99a5"/>
          <animateMotion dur="16s" repeatCount="indefinite" keyTimes="0;0.22;0.38;0.58;1" values="290,88;290,88;290,202;290,265;290,265"/>
        </g>
      </g>
      <g class="reduced" style="display:none"><rect x="266" y="188" width="48" height="28" fill="#f4caca" stroke="#b84d5d" stroke-width="2"/></g>
      <text x="316" y="112" class="sans small" fill="#9a3f67">moving pallet truck</text>

      <!-- robot -->
      <g class="animated">
        <g>
          <rect x="-17" y="-13" width="34" height="26" fill="#dce9f6" stroke="#245b88" stroke-width="2"/>
          <circle cx="-11" cy="17" r="5" fill="#26323d"/><circle cx="11" cy="17" r="5" fill="#26323d"/>
          <path d="M0 -13 L8 -23 L-8 -23 Z" fill="#6d8fb3"/>
          <circle cx="0" cy="0" r="34" fill="none" stroke="#6d8fb3" stroke-dasharray="3 5" opacity=".35"/>
          <animateMotion dur="16s" repeatCount="indefinite" keyTimes="0;0.30;0.39;0.54;0.66;1" keyPoints="0;0.37;0.37;0.58;0.58;1" calcMode="linear" path="M70 220 C145 216 210 210 285 202 C300 200 311 193 320 184 C330 156 350 143 390 141 C430 133 449 141 465 142 C520 111 566 100 610 92"/>
        </g>
      </g>
      <g class="reduced" style="display:none"><rect x="593" y="79" width="34" height="26" fill="#dce9f6" stroke="#245b88" stroke-width="2"/></g>

      <!-- sensor alert pulse -->
      <circle cx="290" cy="202" r="18" fill="none" stroke="#c94a4a" stroke-width="3" opacity="0" class="animated">
        <animate attributeName="r" values="18;18;55;18;18" keyTimes="0;0.29;0.38;0.44;1" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.31;0.41;0.46;1" dur="16s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- runtime status -->
    <g transform="translate(18 445)">
      <rect width="654" height="66" fill="#fff" stroke="#d4dae1"/>
      <text x="12" y="20" class="sans small muted">Current event</text>
      <g class="animated">
        <g class="phase"><text x="12" y="45" class="sans body" fill="#2f6fbd">NavigateToGoal is RUNNING; obstacle range is clear.</text><animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.29;0.31;0.99;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="45" class="sans body" fill="#9a3f67">LiDAR detects crossing obstacle; navigation goal is HALTED on the next root tick.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.40;0.42;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="45" class="sans body" fill="#a95a13">AvoidObstacle RUNNING; local detour is executed while nominal navigation remains inactive.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.42;0.55;0.57;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="45" class="sans body" fill="#6847a5">Recovery succeeds; path is replanned around the cleared crossing zone.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.66;0.68;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="45" class="sans body" fill="#28775f">NavigateToGoal resumes with updated path and eventually reaches the inspection goal.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.67;0.69;0.99;1" dur="16s" repeatCount="indefinite"/></g>
      </g>
      <text x="12" y="45" class="sans body reduced" style="display:none" fill="#28775f">Reduced-motion view: recovery complete; navigation resumes on the updated path.</text>
    </g>
  </g>

  <!-- BT -->
  <g transform="translate(748 108)">
    <rect width="616" height="530" class="panel"/>
    <text x="18" y="30" class="serif h2">B. Synchronized behavior tree and blackboard</text>

    <!-- blackboard -->
    <g transform="translate(18 54)">
      <rect width="580" height="78" fill="#f8fafc" stroke="#94a3b8"/>
      <text x="12" y="20" class="sans label">Blackboard xₜ</text>
      <g class="animated">
        <g class="phase"><text x="12" y="43" class="mono">obstacle=false  nav=RUNNING  path=v1  recovery=none</text><animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.29;0.31;0.99;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="43" class="mono">obstacle=true   nav=HALTED   path=v1  recovery=avoid</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.55;0.57;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="43" class="mono">obstacle=false  nav=IDLE     path=v2  recovery=replan</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.67;0.69;1" dur="16s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="12" y="43" class="mono">obstacle=false  nav=RUNNING  path=v2  recovery=none</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.70;0.99;1" dur="16s" repeatCount="indefinite"/></g>
      </g>
      <text x="12" y="43" class="mono reduced" style="display:none">obstacle=false  nav=RUNNING  path=v2  recovery=none</text>
      <text x="12" y="63" class="mono">goal=(8.2,3.1)  battery=0.42  localized=true</text>
    </g>

    <!-- tree edges -->
    <path d="M308 190 V219 H118 V247" class="edge"/><path d="M308 219 H308 V247" class="edge"/><path d="M308 219 H500 V247" class="edge"/>
    <path d="M118 295 V323 H67 V347" class="edge"/><path d="M118 323 H169 V347" class="edge"/>
    <path d="M308 295 V323 H257 V347" class="edge"/><path d="M308 323 H359 V347" class="edge"/>
    <path d="M500 295 V323 H445 V347" class="edge"/><path d="M500 323 H555 V347" class="edge"/>
    <path d="M500 399 V425 H470 V451" class="edge"/><path d="M500 425 H548 V451" class="edge"/>

    <rect x="220" y="154" width="176" height="50" class="node" fill="#e7eff6" stroke="#245b88"/><text x="308" y="184" text-anchor="middle" class="sans label">Reactive Fallback</text>
    <rect x="65" y="247" width="106" height="48" class="node" fill="#eef8f3" stroke="#28775f"/><text x="118" y="276" text-anchor="middle" class="sans label">Sequence</text>
    <rect x="255" y="247" width="106" height="48" class="node" fill="#eef8f3" stroke="#28775f"/><text x="308" y="276" text-anchor="middle" class="sans label">Sequence</text>
    <rect x="447" y="247" width="106" height="48" class="node" fill="#eef8f3" stroke="#28775f"/><text x="500" y="276" text-anchor="middle" class="sans label">Sequence</text>

    <rect x="20" y="347" width="94" height="52" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="67" y="369" text-anchor="middle" class="sans label">BatteryLow?</text><text x="67" y="386" text-anchor="middle" class="sans small">condition</text>
    <rect x="122" y="347" width="94" height="52" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="169" y="369" text-anchor="middle" class="sans label">Dock</text><text x="169" y="386" text-anchor="middle" class="sans small">action</text>
    <rect x="210" y="347" width="94" height="52" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="257" y="369" text-anchor="middle" class="sans label">Obstacle?</text><text x="257" y="386" text-anchor="middle" class="sans small">condition</text>
    <rect x="312" y="347" width="94" height="52" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="359" y="369" text-anchor="middle" class="sans label">Avoid</text><text x="359" y="386" text-anchor="middle" class="sans small">action</text>
    <rect x="398" y="347" width="94" height="52" class="node" fill="#fff0f1" stroke="#b84d5d"/><text x="445" y="369" text-anchor="middle" class="sans label">GoalValid?</text><text x="445" y="386" text-anchor="middle" class="sans small">condition</text>
    <rect x="508" y="347" width="94" height="52" class="node" fill="#f3f0fb" stroke="#6847a5"/><text x="555" y="369" text-anchor="middle" class="sans label">Fallback</text><text x="555" y="386" text-anchor="middle" class="sans small">nav recovery</text>
    <rect x="421" y="451" width="98" height="52" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="470" y="473" text-anchor="middle" class="sans label">FollowPath</text><text x="470" y="490" text-anchor="middle" class="sans small">action</text>
    <rect x="527" y="451" width="84" height="52" class="node" fill="#fff6e9" stroke="#a95a13"/><text x="569" y="473" text-anchor="middle" class="sans label">Replan</text><text x="569" y="490" text-anchor="middle" class="sans small">action</text>

    <!-- animated highlights -->
    <g class="animated">
      <rect x="416" y="446" width="108" height="62" class="hi" stroke="#2f6fbd" opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1;0" keyTimes="0;0.29;0.31;0.67;0.70;0.99;1" dur="16s" repeatCount="indefinite"/></rect>
      <rect x="205" y="342" width="104" height="62" class="hi" stroke="#4b9a62" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.29;0.31;0.55;0.57;1" dur="16s" repeatCount="indefinite"/></rect>
      <rect x="307" y="342" width="104" height="62" class="hi" stroke="#a95a13" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.39;0.41;0.55;0.57;1" dur="16s" repeatCount="indefinite"/></rect>
      <rect x="522" y="446" width="94" height="62" class="hi" stroke="#6847a5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.67;0.69;1" dur="16s" repeatCount="indefinite"/></rect>
    </g>

    <g transform="translate(18 513)">
      <rect x="0" y="0" width="12" height="12" fill="#4b9a62"/><text x="18" y="11" class="sans small">Success/true</text>
      <rect x="102" y="0" width="12" height="12" fill="#c94a4a"/><text x="120" y="11" class="sans small">Failure/false</text>
      <rect x="206" y="0" width="12" height="12" fill="#2f6fbd"/><text x="224" y="11" class="sans small">Running</text>
      <rect x="286" y="0" width="12" height="12" fill="#a95a13"/><text x="304" y="11" class="sans small">Current action</text>
      <text x="414" y="11" class="sans small muted">tick ≈ 20 Hz</text>
    </g>
  </g>

  <!-- event timeline -->
  <g transform="translate(36 664)">
    <rect width="1328" height="150" class="panel"/>
    <text x="18" y="28" class="serif h2">C. Event / status timeline</text>
    <line x1="34" y1="74" x2="1292" y2="74" stroke="#94a3b8" stroke-width="2"/>
    <g class="sans small">
      <circle cx="82" cy="74" r="6" fill="#2f6fbd"/><text x="82" y="54" text-anchor="middle">t₀</text><text x="82" y="101" text-anchor="middle">FollowPath:R</text>
      <circle cx="378" cy="74" r="6" fill="#9a3f67"/><text x="378" y="54" text-anchor="middle">obstacle detected</text><text x="378" y="101" text-anchor="middle">halt nav</text>
      <circle cx="604" cy="74" r="6" fill="#a95a13"/><text x="604" y="54" text-anchor="middle">recovery active</text><text x="604" y="101" text-anchor="middle">Avoid:R</text>
      <circle cx="808" cy="74" r="6" fill="#6847a5"/><text x="808" y="54" text-anchor="middle">obstacle clears</text><text x="808" y="101" text-anchor="middle">Replan:S</text>
      <circle cx="1035" cy="74" r="6" fill="#2f6fbd"/><text x="1035" y="54" text-anchor="middle">mission resumes</text><text x="1035" y="101" text-anchor="middle">FollowPath:R</text>
      <circle cx="1262" cy="74" r="6" fill="#28775f"/><text x="1262" y="54" text-anchor="middle">goal reached</text><text x="1262" y="101" text-anchor="middle">root:S</text>
    </g>
    <g class="animated"><rect x="34" y="124" width="1258" height="6" fill="#e2e8f0"/><rect x="34" y="124" width="0" height="6" fill="#245b88"><animate attributeName="width" values="0;1258" dur="16s" repeatCount="indefinite"/></rect></g>
  </g>

  <text x="36" y="844" class="sans small muted">Repository-authored execution example. Timing is illustrative; the architectural behavior—root re-evaluation, action halting, recovery priority, and resumption—is the key point.</text>
</svg>