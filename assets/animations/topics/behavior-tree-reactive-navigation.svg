<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Animated behavior tree execution for reactive mobile-robot navigation</title>
  <desc id="desc">A twelve-second loop in which a mobile robot navigates toward a goal, detects an obstacle, preempts navigation to run an avoidance action, then resumes navigation and succeeds. Corresponding behavior-tree nodes are highlighted through the same phases.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#718096"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif;fill:#17202a}.sans{font-family:Arial,Helvetica,sans-serif;fill:#27313b}.title{font-size:28px;font-weight:700}.subtitle{font-size:17px;fill:#5f6b78}.label{font-size:15px;font-weight:700}.small{font-size:13px}.muted{fill:#687582}.edge{stroke:#718096;stroke-width:1.6;fill:none}.node{stroke-width:1.5}.phase{opacity:0}.statusline{font-size:16px;font-weight:700}
      @media (prefers-reduced-motion: reduce){.animated{display:none}.reduced{display:block!important}}
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e6eaee" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="42" y="48" class="serif title">Reactive execution over repeated ticks</text>
  <text x="42" y="77" class="sans subtitle">Example: navigation is interrupted by obstacle avoidance, then resumes when the higher-priority condition clears.</text>

  <g transform="translate(42 112)">
    <rect width="545" height="500" fill="#fbfcfd" stroke="#cbd2da"/>
    <text x="20" y="31" class="serif" font-size="19" font-weight="700">Robot/environment state</text>
    <g transform="translate(20 54)">
      <rect width="505" height="334" fill="url(#grid)" stroke="#d7dde4"/>
      <path d="M52 272 C112 230 156 223 205 217 C244 212 266 184 290 149 C327 96 384 83 455 73" fill="none" stroke="#b6c1cc" stroke-width="4" stroke-dasharray="9 8"/>
      <rect x="244" y="145" width="72" height="68" fill="#f7d7d7" stroke="#b84d5d" stroke-width="2"/>
      <text x="280" y="181" text-anchor="middle" class="sans small" fill="#8f3543">obstacle</text>
      <circle cx="458" cy="69" r="16" fill="#d9f0df" stroke="#28775f" stroke-width="2"/>
      <text x="458" y="42" text-anchor="middle" class="sans small" fill="#28775f">goal</text>

      <g class="animated">
        <g id="robot">
          <rect x="-14" y="-11" width="28" height="22" fill="#dce9f6" stroke="#245b88" stroke-width="2"/>
          <circle cx="-9" cy="14" r="4" fill="#27313b"/><circle cx="9" cy="14" r="4" fill="#27313b"/>
          <circle cx="0" cy="-16" r="4" fill="#a95a13"/>
          <animateMotion dur="12s" repeatCount="indefinite" keyTimes="0;0.29;0.36;0.56;0.68;1" keyPoints="0;0.38;0.38;0.58;0.58;1" calcMode="linear" path="M52 272 C112 230 156 223 205 217 C224 214 232 211 238 204 C222 176 225 137 253 116 C284 91 322 92 350 103 C385 86 420 76 455 73"/>
        </g>
        <circle cx="244" cy="145" r="7" fill="#c94a4a">
          <animate attributeName="r" values="7;7;16;7;7" keyTimes="0;0.28;0.34;0.48;1" dur="12s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.27;0.33;0.58;0.64" dur="12s" repeatCount="indefinite"/>
        </circle>
      </g>

      <g class="reduced" style="display:none">
        <rect x="434" y="58" width="28" height="22" fill="#dce9f6" stroke="#245b88" stroke-width="2"/>
      </g>
    </g>

    <g transform="translate(20 412)">
      <text x="0" y="0" class="sans small muted">Execution phase</text>
      <g class="animated">
        <g class="phase"><text x="0" y="30" class="sans statusline" fill="#2f6fbd">1. NavigateToGoal → Running</text><animate attributeName="opacity" values="1;1;0;0;0" keyTimes="0;0.28;0.30;0.99;1" dur="12s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="0" y="30" class="sans statusline" fill="#9a3f67">2. Obstacle detected → navigation preempted</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.27;0.30;0.38;0.41;1" dur="12s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="0" y="30" class="sans statusline" fill="#a95a13">3. AvoidObstacle → Running → Success</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.60;0.63;1" dur="12s" repeatCount="indefinite"/></g>
        <g class="phase"><text x="0" y="30" class="sans statusline" fill="#28775f">4. NavigateToGoal resumes → Success</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.62;0.65;0.98;1" dur="12s" repeatCount="indefinite"/></g>
      </g>
      <text x="0" y="65" class="sans small muted">The root is evaluated again every control cycle; there is no explicit transition edge from Navigate to Avoid.</text>
    </g>
  </g>

  <g transform="translate(615 112)">
    <rect width="543" height="500" fill="#fff" stroke="#cbd2da"/>
    <text x="20" y="31" class="serif" font-size="19" font-weight="700">Tree execution (synchronized)</text>

    <line x1="272" y1="114" x2="150" y2="185" class="edge"/>
    <line x1="272" y1="114" x2="395" y2="185" class="edge"/>
    <line x1="150" y1="235" x2="78" y2="310" class="edge"/>
    <line x1="150" y1="235" x2="222" y2="310" class="edge"/>
    <line x1="395" y1="235" x2="329" y2="310" class="edge"/>
    <line x1="395" y1="235" x2="461" y2="310" class="edge"/>

    <rect x="186" y="72" width="172" height="52" class="node" fill="#e7eff6" stroke="#245b88"/>
    <text x="272" y="103" text-anchor="middle" class="sans label">Fallback</text>

    <rect x="84" y="185" width="132" height="50" class="node" fill="#eef8f3" stroke="#28775f"/>
    <text x="150" y="215" text-anchor="middle" class="sans label">Sequence</text>
    <rect x="329" y="185" width="132" height="50" class="node" fill="#eef8f3" stroke="#28775f"/>
    <text x="395" y="215" text-anchor="middle" class="sans label">Sequence</text>

    <rect id="obstacleCond" x="20" y="310" width="116" height="62" class="node" fill="#fff0f1" stroke="#b84d5d"/>
    <text x="78" y="335" text-anchor="middle" class="sans label">Condition</text><text x="78" y="355" text-anchor="middle" class="sans small">Obstacle?</text>
    <rect id="avoidAction" x="164" y="310" width="116" height="62" class="node" fill="#fff6e9" stroke="#a95a13"/>
    <text x="222" y="335" text-anchor="middle" class="sans label">Action</text><text x="222" y="355" text-anchor="middle" class="sans small">Avoid</text>
    <rect x="271" y="310" width="116" height="62" class="node" fill="#fff0f1" stroke="#b84d5d"/>
    <text x="329" y="335" text-anchor="middle" class="sans label">Condition</text><text x="329" y="355" text-anchor="middle" class="sans small">GoalKnown?</text>
    <rect id="navAction" x="403" y="310" width="116" height="62" class="node" fill="#fff6e9" stroke="#a95a13"/>
    <text x="461" y="335" text-anchor="middle" class="sans label">Action</text><text x="461" y="355" text-anchor="middle" class="sans small">Navigate</text>

    <g class="animated">
      <rect x="398" y="305" width="126" height="72" fill="none" stroke="#2f6fbd" stroke-width="4" opacity="0"><animate attributeName="opacity" values="1;1;0;0;1;1;0" keyTimes="0;0.28;0.31;0.61;0.64;0.97;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="15" y="305" width="126" height="72" fill="none" stroke="#28775f" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.31;0.60;0.63;1" dur="12s" repeatCount="indefinite"/></rect>
      <rect x="159" y="305" width="126" height="72" fill="none" stroke="#a95a13" stroke-width="4" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.38;0.41;0.60;0.63;1" dur="12s" repeatCount="indefinite"/></rect>
    </g>

    <g transform="translate(20 410)">
      <rect x="0" y="0" width="14" height="14" fill="#4b9a62"/><text x="22" y="12" class="sans small">Success / true</text>
      <rect x="126" y="0" width="14" height="14" fill="#c94a4a"/><text x="148" y="12" class="sans small">Failure / false</text>
      <rect x="254" y="0" width="14" height="14" fill="#2f6fbd"/><text x="276" y="12" class="sans small">Running</text>
      <rect x="348" y="0" width="14" height="14" fill="#a95a13"/><text x="370" y="12" class="sans small">Current action</text>
      <text x="0" y="47" class="sans small muted">Priority: obstacle recovery subtree is checked before ordinary navigation.</text>
      <text x="0" y="72" class="sans small muted">When Obstacle? becomes true, the higher-priority branch takes control on the next tick.</text>
    </g>
  </g>

  <g class="animated" transform="translate(42 640)">
    <rect x="0" y="0" width="1116" height="8" fill="#e1e6eb"/>
    <rect x="0" y="0" width="1116" height="8" fill="#245b88">
      <animate attributeName="width" values="0;1116" dur="12s" repeatCount="indefinite"/>
    </rect>
    <text x="0" y="31" class="sans small muted">12 s loop</text>
    <text x="1100" y="31" text-anchor="end" class="sans small muted">restarts</text>
  </g>
</svg>