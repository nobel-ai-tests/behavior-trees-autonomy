      - name: Commit generated resources
        shell: bash
        run: |
          rm -f scripts/materialize_decision_resources.py
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kb-manifest.json topics libraries assets/figures assets/kb-graph.js assets/kb.css
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Add fast decision resources and Bonsai library"
          git push
